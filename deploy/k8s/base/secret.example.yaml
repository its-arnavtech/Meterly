# EXAMPLE ONLY. Do not apply this file to a real cluster as-is.
#
# It exists so `kubectl kustomize` renders a complete, self-consistent manifest set and so the shape
# of every secret each Deployment expects is documented in one place. Before a real deployment, replace
# it with secrets from your platform's actual secret manager (e.g. `kubectl create secret generic
# meterly-secrets --from-literal=...`, a Sealed Secret, or an External Secrets Operator resource that
# projects the same keys) — see docs/operations.md "Secrets & JWT key rotation".
#
# overlays/local may apply this file verbatim to bring up a throwaway local cluster (kind/minikube);
# the values below are not secret and must never be reused anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: meterly-secrets
  namespace: meterly
type: Opaque
stringData:
  DB_PASSWORD: "REPLACE_ME_meterly_app_password"
  DB_OWNER_PASSWORD: "REPLACE_ME_meterly_owner_password"
  INTERNAL_TOKEN: "REPLACE_ME_internal_service_token"
---
# RS256 key pair tenant-service uses to sign access tokens and publish JWKS. Generate a real one with,
# e.g., `openssl genrsa -out jwt-private.pem 3072 && openssl rsa -in jwt-private.pem -pubout -out jwt-public.pem`.
apiVersion: v1
kind: Secret
metadata:
  name: meterly-jwt-keys
  namespace: meterly
type: Opaque
stringData:
  jwt-private.pem: |
    REPLACE_ME_WITH_A_REAL_PKCS8_RSA_PRIVATE_KEY_PEM
  jwt-public.pem: |
    REPLACE_ME_WITH_THE_MATCHING_SUBJECTPUBLICKEYINFO_PEM
