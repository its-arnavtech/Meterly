apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: meterly
data:
  SERVER_PORT: "8084"
  BILLING_CLOSE_CRON: "0 0 2 1 * *"
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: meterly
  labels: {app.kubernetes.io/name: billing-service, app.kubernetes.io/part-of: meterly}
spec:
  selector: {app.kubernetes.io/name: billing-service}
  ports: [{name: http, port: 8084, targetPort: 8084}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: meterly
  labels: {app.kubernetes.io/name: billing-service, app.kubernetes.io/part-of: meterly}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: billing-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: billing-service, app.kubernetes.io/part-of: meterly}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8084", prometheus.io/path: /actuator/prometheus}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: billing-service
          image: meterly/billing-service:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8084}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom:
            - configMapRef: {name: meterly-shared-config}
            - configMapRef: {name: billing-service-config}
          env:
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: meterly-secrets, key: DB_PASSWORD}}}
            - {name: INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: meterly-secrets, key: INTERNAL_TOKEN}}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8084}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8084}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - {name: tmp, emptyDir: {}}
