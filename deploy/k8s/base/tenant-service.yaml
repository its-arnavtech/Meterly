apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-service-config
  namespace: meterly
data:
  SERVER_PORT: "8081"
  JWT_KEY_ID: k8s-rsa-1
  REFRESH_COOKIE_SECURE: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: meterly
  labels: {app.kubernetes.io/name: tenant-service, app.kubernetes.io/part-of: meterly}
spec:
  selector: {app.kubernetes.io/name: tenant-service}
  ports: [{name: http, port: 8081, targetPort: 8081}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: meterly
  labels: {app.kubernetes.io/name: tenant-service, app.kubernetes.io/part-of: meterly}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: tenant-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: tenant-service, app.kubernetes.io/part-of: meterly}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8081", prometheus.io/path: /actuator/prometheus}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: tenant-service
          image: meterly/tenant-service:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8081}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom:
            - configMapRef: {name: meterly-shared-config}
            - configMapRef: {name: tenant-service-config}
          env:
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: meterly-secrets, key: DB_PASSWORD}}}
            - {name: INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: meterly-secrets, key: INTERNAL_TOKEN}}}
            - {name: JWT_PRIVATE_KEY_PATH, value: /run/keys/jwt-private.pem}
            - {name: JWT_PUBLIC_KEY_PATH, value: /run/keys/jwt-public.pem}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: jwt-keys, mountPath: /run/keys, readOnly: true}
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8081}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: jwt-keys, secret: {secretName: meterly-jwt-keys, defaultMode: 0440}}
