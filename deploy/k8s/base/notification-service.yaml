apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: meterly
data:
  SERVER_PORT: "8085"
  EMAIL_PROVIDER: smtp
  EMAIL_FROM: billing@meterly.example
  SMTP_HOST: REPLACE_WITH_SMTP_HOST
  SMTP_PORT: "587"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: meterly
  labels: {app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: meterly}
spec:
  selector: {app.kubernetes.io/name: notification-service}
  ports: [{name: http, port: 8085, targetPort: 8085}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: meterly
  labels: {app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: meterly}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: notification-service}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: notification-service, app.kubernetes.io/part-of: meterly}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8085", prometheus.io/path: /actuator/prometheus}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: notification-service
          image: meterly/notification-service:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8085}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          envFrom:
            - configMapRef: {name: meterly-shared-config}
            - configMapRef: {name: notification-service-config}
          env:
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: meterly-secrets, key: DB_PASSWORD}}}
            - {name: INTERNAL_TOKEN, valueFrom: {secretKeyRef: {name: meterly-secrets, key: INTERNAL_TOKEN}}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: 750m, memory: 512Mi}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8085}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8085}
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 6
      volumes:
        - {name: tmp, emptyDir: {}}
