# Values shared by every backend service. Per-service ConfigMaps (in each service's manifest) hold the
# handful of values that differ (SERVER_PORT, and notification-service's email provider).
#
# DB_URL / KAFKA_BOOTSTRAP_SERVERS / REDIS_HOST are placeholders: PostgreSQL, Redis and Kafka are treated
# as externally managed infrastructure in Kubernetes (RDS/Cloud SQL/Aiven-style Postgres, ElastiCache/
# Memorystore-style Redis, a managed Kafka or a self-hosted Redpanda/Strimzi cluster) — this repo does not
# deploy them. Point these at your real endpoints in an overlay; see docs/operations.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: meterly-shared-config
  namespace: meterly
data:
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:postgresql://REPLACE_WITH_MANAGED_POSTGRES_HOST:5432/meterly
  DB_USERNAME: meterly_app
  KAFKA_BOOTSTRAP_SERVERS: REPLACE_WITH_MANAGED_KAFKA_BOOTSTRAP:9092
  REDIS_HOST: REPLACE_WITH_MANAGED_REDIS_HOST
  REDIS_PORT: "6379"
  JWT_JWKS_URI: http://tenant-service.meterly.svc.cluster.local:8081/.well-known/jwks.json
  JWT_ISSUER: meterly
  JWT_AUDIENCE: meterly-api
  TENANT_SERVICE_URL: http://tenant-service.meterly.svc.cluster.local:8081
  CORS_ALLOWED_ORIGINS: https://meterly.local
  # Histogram buckets for Prometheus p95/p99 (see deploy/observability); a plain Spring Boot property.
  MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILES_HISTOGRAM_HTTP_SERVER_REQUESTS: "true"
