# Autoscale the two services on the hot path: ingestion (inbound event volume) and metering
# (Kafka consumer throughput). Both scale on CPU; partition/consumer-concurrency limits for metering
# are documented in docs/operations.md ("Scaling").
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-service
  namespace: meterly
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ingestion-service}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metering-service
  namespace: meterly
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: metering-service}
  minReplicas: 2
  # usage-events has 12 partitions (see deploy/redpanda/create-topics.sh); more consumer replicas than
  # partitions just sit idle, so this is also the natural ceiling for the metering-service group.
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
