# One-shot Flyway migration, run as the schema-owner role, before any service starts. Re-running is
# safe (Flyway is idempotent); Kustomize's `configMapGenerator`/Job semantics mean you re-create this
# Job (e.g. `kubectl delete job/meterly-migrator -n meterly` then re-apply, or use a Helm-style hook —
# plain kustomize has no native "pre-install hook", so operators trigger it explicitly; see
# docs/operations.md). Demo data is intentionally NOT enabled here (MIGRATION_LOCATIONS omits
# classpath:db/demo) — unlike the Compose stack, a Kubernetes deployment is not assumed to be a demo.
apiVersion: batch/v1
kind: Job
metadata:
  name: meterly-migrator
  namespace: meterly
  labels: {app.kubernetes.io/name: meterly-migrator, app.kubernetes.io/part-of: meterly}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app.kubernetes.io/name: meterly-migrator}
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrator
          image: meterly/migrator:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: DB_URL, valueFrom: {configMapKeyRef: {name: meterly-shared-config, key: DB_URL}}}
            - {name: DB_OWNER_USERNAME, value: meterly_owner}
            - {name: DB_OWNER_PASSWORD, valueFrom: {secretKeyRef: {name: meterly-secrets, key: DB_OWNER_PASSWORD}}}
            - {name: DB_APP_ROLE, value: meterly_app}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
