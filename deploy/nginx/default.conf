map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_types text/plain text/css application/json application/javascript text/javascript
    text/xml application/xml application/xml+rss image/svg+xml font/woff2 font/woff;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 256k;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;

    location = /health { access_log off; return 200 'ok'; }
    # index.html is the SPA shell: never cache it so a new deploy is picked up on next load.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    # Angular's production build content-hashes js/css/font filenames (outputHashing: all),
    # so these are safe to cache forever; a new build ships under new filenames.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # Other static assets (favicon, images) aren't content-hashed; cache briefly.
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location ~ ^/(actuator|internal|v3|swagger-ui|\.well-known)/ { return 404; }
    location = /ws/usage {
        proxy_pass http://metering-service:8083;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }
    location ~ ^/v1/usage-events(?:/|$) { proxy_pass http://ingestion-service:8082; }
    location ~ ^/v1/usage(?:/|$) { proxy_pass http://metering-service:8083; }
    location ~ ^/v1/(billing|invoices)(?:/|$) { proxy_pass http://billing-service:8084; }
    location ~ ^/v1/notifications(?:/|$) { proxy_pass http://notification-service:8085; }
    location ~ ^/v1/(auth|tenants|me|tenant|plans|subscription|resources|users|api-keys)(?:/|$) {
        proxy_pass http://tenant-service:8081;
    }
    location /v1/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
