<div class="meterly-page">
  <header class="list-header">
    <h1>Resources</h1>
    <button mat-flat-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>
      New resource
    </button>
  </header>

  @if (loading()) {
    <div class="meterly-empty-state">
      <mat-icon>hourglass_empty</mat-icon>
      <span>Loading resources…</span>
    </div>
  } @else {
    <table mat-table [dataSource]="resources()" class="resource-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let r">{{ r.name }}</td>
      </ng-container>
      <ng-container matColumnDef="unit_label">
        <th mat-header-cell *matHeaderCellDef>Unit</th>
        <td mat-cell *matCellDef="let r">{{ r.unit_label }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let r"><mat-chip>{{ r.status }}</mat-chip></td>
      </ng-container>
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let r">{{ r.created_at | date: 'mediumDate' }}</td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let r">
          <button mat-button (click)="rename(r)">Rename</button>
          <button mat-button [color]="r.status === 'ACTIVE' ? 'warn' : 'primary'" (click)="toggleArchive(r)">
            {{ r.status === 'ACTIVE' ? 'Archive' : 'Reactivate' }}
          </button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  }
</div>
