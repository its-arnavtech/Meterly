<div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
@if (auth.session(); as session) {
  <div class="app-shell">
    <header>
      <a class="logo" routerLink="/dashboard"><span>M</span> Meterly</a>
      <nav aria-label="Primary">
        <a routerLink="/dashboard" routerLinkActive="active">Usage</a>
        @if (session.role === 'TENANT_ADMIN') {
          <a routerLink="/billing" routerLinkActive="active">Billing</a>
        }
      </nav>
      <div class="account">
        <div><strong>{{ session.email }}</strong><span>{{ session.role }}</span></div>
        <button mat-stroked-button (click)="logout()">Sign out</button>
      </div>
    </header>
    <main class="workspace"><router-outlet /></main>
  </div>
} @else {
  <router-outlet />
}
