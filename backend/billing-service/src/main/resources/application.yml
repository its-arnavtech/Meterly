server:
  port: 8083
spring:
  application:
    name: billing-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meterly}
    username: ${SPRING_DATASOURCE_USERNAME:meterly_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
meterly:
  billing:
    scheduler:
      enabled: ${BILLING_SCHEDULER_ENABLED:true}
      cron: ${BILLING_SCHEDULER_CRON:0 0 3 1 * *}
  auth:
    jwt-secret: ${JWT_SECRET}
    token-seconds: 3600
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  structured:
    format:
      console: logstash
