server:
  port: 8082
spring:
  application:
    name: metering-billing-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meterly}
    username: ${SPRING_DATASOURCE_USERNAME:meterly_app}
    password: ${SPRING_DATASOURCE_PASSWORD:meterly-app-local}
    hikari:
      maximum-pool-size: 10
  flyway:
    user: ${SPRING_FLYWAY_USER:meterly_owner}
    password: ${SPRING_FLYWAY_PASSWORD:meterly-owner-local}
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: meterly-metering
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.meterly.billing.metering
        spring.json.value.default.type: com.meterly.billing.metering.UsageEventMessage
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
meterly:
  auth:
    jwt-secret: ${JWT_SECRET:meterly-local-development-secret-32}
    token-seconds: 3600
    tenant-id: ${METERLY_TENANT_ID:11111111-1111-1111-1111-111111111111}
  ingestion-api-key: ${METERLY_API_KEY:meterly-poc-api-key}
management:
  endpoints:
    web:
      exposure:
        include: health,info
