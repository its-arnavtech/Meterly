server:
  port: 8082
spring:
  application:
    name: metering-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meterly}
    username: ${SPRING_DATASOURCE_USERNAME:meterly_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: meterly-metering
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.meterly.platform.usage
        spring.json.value.default.type: com.meterly.platform.usage.UsageEventMessage
        spring.json.use.type.headers: false
meterly:
  notifications:
    usage-threshold: ${USAGE_NOTIFICATION_THRESHOLD:1000}
  reconciliation:
    enabled: ${RECONCILIATION_ENABLED:true}
    cron: ${RECONCILIATION_CRON:0 0 2 * * *}
  auth:
    jwt-secret: ${JWT_SECRET:}
    token-seconds: 3600
    issuer-uri: ${KEYCLOAK_ISSUER_URI:}
    jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
logging:
  structured:
    format:
      console: logstash
