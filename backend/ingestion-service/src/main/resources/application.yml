server:
  port: 8081
spring:
  application:
    name: ingestion-service
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
meterly:
  rate-limit:
    capacity: ${RATE_LIMIT_CAPACITY:20}
    refill-per-second: ${RATE_LIMIT_REFILL_PER_SECOND:10}
  tenant-service:
    base-url: ${TENANT_SERVICE_URL:http://localhost:8080}
  internal:
    service-key: ${INTERNAL_SERVICE_KEY:meterly-internal-local-secret}
management:
  endpoints:
    web:
      exposure:
        include: health,info
