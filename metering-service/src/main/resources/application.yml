server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: metering-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meterly}
    username: ${DB_USERNAME:meterly_app}
    password: ${DB_PASSWORD:meterly_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets so Prometheus can compute p95/p99 with histogram_quantile().
      percentiles-histogram:
        "[http.server.requests]": true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

meterly:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:meterly}
      audience: ${JWT_AUDIENCE:meterly-api}
    internal-token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  metering:
    consumer:
      group-id: ${METERING_CONSUMER_GROUP:metering-service}
      concurrency: ${METERING_CONSUMER_CONCURRENCY:3}
      backoff:
        initial-interval: ${METERING_RETRY_INITIAL_INTERVAL:500ms}
        multiplier: ${METERING_RETRY_MULTIPLIER:2.0}
        max-interval: ${METERING_RETRY_MAX_INTERVAL:10s}
        max-retries: ${METERING_RETRY_MAX_RETRIES:6}
    topics:
      usage-events-partitions: ${USAGE_EVENTS_PARTITIONS:12}
      notification-events-partitions: ${NOTIFICATION_EVENTS_PARTITIONS:6}
      replication-factor: ${KAFKA_TOPIC_REPLICAS:1}
    outbox:
      relay-interval: ${METERING_OUTBOX_RELAY_INTERVAL:2s}
      batch-size: ${METERING_OUTBOX_BATCH_SIZE:100}
      send-timeout: ${METERING_OUTBOX_SEND_TIMEOUT:10s}
    stomp:
      heartbeat: ${METERING_STOMP_HEARTBEAT:10s}
    # Nightly re-derivation of the open period's counters from the ledger (UTC).
    reconciliation-cron: ${METERING_RECONCILIATION_CRON:0 0 3 * * *}
