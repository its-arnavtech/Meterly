server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  # The edge must sanitize forwarded headers. Default to the actual peer address for auth throttling.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  application:
    name: tenant-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meterly}
    username: ${DB_USERNAME:meterly_app}
    password: ${DB_PASSWORD:meterly_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis only backs auth throttling, which fails open: never let a Redis outage stall a login.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # Throttling degrades gracefully without Redis, so Redis must not take tenant-service out of rotation.
    redis:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

meterly:
  tenant:
    jwt:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:}
      key-id: ${JWT_KEY_ID:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      # allow-ephemeral-key: unset = true unless the prod profile is active
      # (override with env METERLY_TENANT_JWT_ALLOWEPHEMERALKEY=true|false).
      # Key rotation: publish the previous public key alongside the new signing key until the last
      # token signed with it has expired, e.g.
      #   additional-public-keys[0].path: /run/keys/jwt-public-previous.pem
      #   additional-public-keys[0].key-id: local-rsa-0
      # (env METERLY_TENANT_JWT_ADDITIONALPUBLICKEYS_0_PATH / ..._0_KEYID).
    throttle:
      login-ip:
        capacity: ${THROTTLE_LOGIN_IP_CAPACITY:50}
        refill-per-minute: ${THROTTLE_LOGIN_IP_REFILL_PER_MINUTE:20}
      login-email:
        capacity: ${THROTTLE_LOGIN_EMAIL_CAPACITY:10}
        refill-per-minute: ${THROTTLE_LOGIN_EMAIL_REFILL_PER_MINUTE:1}
      signup-ip:
        capacity: ${THROTTLE_SIGNUP_IP_CAPACITY:10}
        refill-per-minute: ${THROTTLE_SIGNUP_IP_REFILL_PER_MINUTE:2}
    bcrypt-strength: ${BCRYPT_STRENGTH:12}
    # Hourly cleanup of expired refresh tokens; "-" disables the job.
    refresh-token-purge-cron: ${REFRESH_TOKEN_PURGE_CRON:0 7 * * * *}
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:7d}
  security:
    jwt:
      # tenant-service validates its own tokens locally; jwks-uri is deliberately not set here.
      issuer: ${JWT_ISSUER:meterly}
      audience: ${JWT_AUDIENCE:meterly-api}
    internal-token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
