name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secrets / Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify backend
        run: mvn --batch-mode --no-transfer-progress verify

  integration-testcontainers:
    name: Integration / Testcontainers (Postgres + Redis + Redpanda)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TESTCONTAINERS_RYUK_DISABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Confirm Docker runner
        run: docker info
      - name: Run defensive integration suite with real infrastructure
        run: >-
          mvn --batch-mode --no-transfer-progress
          -Dtest=TenantRlsHardeningIntegrationTest,TenantRateLimitIntegrationTest,IngestionPipelineIntegrationTest,UsageReconciliationIntegrationTest,BillingIntegrationTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Capture Testcontainers evidence
        if: always()
        run: docker ps --all

  frontend:
    name: Frontend / Angular 21
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  compose:
    name: Docker Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral Compose secrets
        shell: bash
        run: |
          umask 077
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 32)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 32)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "INTERNAL_SERVICE_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Validate Compose model
        run: docker compose config --quiet

  full-stack:
    name: Full stack / three-tenant live smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [secret-scan, backend, integration-testcontainers, frontend, compose]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral Compose secrets
        shell: bash
        run: |
          umask 077
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 32)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 32)"
            echo "JWT_SECRET=$(openssl rand -hex 48)"
            echo "INTERNAL_SERVICE_KEY=$(openssl rand -hex 32)"
          } > .env
      - name: Install smoke client dependency
        working-directory: frontend
        run: npm ci --omit=dev
      - name: Build and start from zero
        run: docker compose up --detach --build --wait
      - name: Verify three live tenants, idempotency, STOMP, RBAC, and invoices
        working-directory: frontend
        run: node scripts/phase1-smoke.mjs
      - name: Verify live tenant-scoped rate-limit isolation
        working-directory: frontend
        run: node scripts/phase2-hardening-smoke.mjs
      - name: Capture container evidence
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=200
      - name: Remove stack and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
