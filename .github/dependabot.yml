version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, java]

  - package-ecosystem: npm
    directory: /meterly-web
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels: [dependencies, frontend]

  # Backend + migrator images (root Dockerfile: tenant/ingestion/metering/billing/notification/migrator targets).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  # SPA/nginx image (separate Dockerfile).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
