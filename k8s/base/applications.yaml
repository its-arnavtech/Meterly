apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-service
  template:
    metadata:
      labels:
        app: tenant-service
    spec:
      initContainers:
        - name: wait-for-keycloak-profile
          image: quay.io/keycloak/keycloak:26.7.0
          command:
            - /bin/bash
            - -ec
            - |
              until /opt/keycloak/bin/kcadm.sh config credentials \
                --server http://keycloak:8080 \
                --realm meterly \
                --client meterly-admin \
                --secret "$KEYCLOAK_ADMIN_CLIENT_SECRET" >/dev/null 2>&1; do
                sleep 3
              done
              until /opt/keycloak/bin/kcadm.sh get users/profile \
                --realm meterly | grep -q '"tenant_id"'; do
                sleep 3
              done
          env:
            - name: KEYCLOAK_ADMIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: meterly-secrets
                  key: KEYCLOAK_ADMIN_CLIENT_SECRET
      containers:
        - name: tenant-service
          image: meterly/tenant-service:phase3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: meterly-config
            - secretRef:
                name: meterly-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
spec:
  selector:
    app: tenant-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
