global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: meterly
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - tenant-service:8080
          - ingestion-service:8081
          - metering-service:8082
          - billing-service:8083
          - notification-service:8084
