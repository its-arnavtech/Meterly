server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: ingestion-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
      connect-timeout: 1s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Histogram buckets so Prometheus can compute p95/p99 with histogram_quantile().
      percentiles-histogram:
        "[http.server.requests]": true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

meterly:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:meterly}
      audience: ${JWT_AUDIENCE:meterly-api}
    internal-token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  ingestion:
    tenant-service-url: ${TENANT_SERVICE_URL:http://localhost:8081}
    tenant-service-connect-timeout: ${INGESTION_TENANT_CONNECT_TIMEOUT:PT2S}
    tenant-service-read-timeout: ${INGESTION_TENANT_READ_TIMEOUT:PT3S}
    max-event-age: ${INGESTION_MAX_EVENT_AGE:PT1H}
    max-clock-skew: ${INGESTION_MAX_CLOCK_SKEW:PT5M}
    resource-cache-ttl: ${INGESTION_RESOURCE_CACHE_TTL:PT60S}
    publish-timeout: ${INGESTION_PUBLISH_TIMEOUT:PT5S}
    auth-cache:
      positive-ttl: ${INGESTION_AUTH_CACHE_POSITIVE_TTL:PT60S}
      negative-ttl: ${INGESTION_AUTH_CACHE_NEGATIVE_TTL:PT10S}
    rate-limit:
      capacity: ${INGESTION_RATE_LIMIT_CAPACITY:500}
      refill-per-second: ${INGESTION_RATE_LIMIT_REFILL_PER_SECOND:200}
