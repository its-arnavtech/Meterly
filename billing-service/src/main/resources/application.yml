server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: billing-service
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meterly}
    username: ${DB_USERNAME:meterly_app}
    password: ${DB_PASSWORD:meterly_app}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

meterly:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:meterly}
      audience: ${JWT_AUDIENCE:meterly-api}
    internal-token: ${INTERNAL_TOKEN:dev-internal-token-change-me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

  billing:
    close-cron: ${BILLING_CLOSE_CRON:0 0 2 1 * *}
    scheduling-enabled: ${BILLING_SCHEDULING_ENABLED:true}
    outbox:
      relay-interval: ${BILLING_OUTBOX_RELAY_INTERVAL:PT2S}
      batch-size: ${BILLING_OUTBOX_BATCH_SIZE:100}
      send-timeout: ${BILLING_OUTBOX_SEND_TIMEOUT:PT15S}
